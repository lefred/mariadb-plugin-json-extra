name: Build and package JSON_EXTRA plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: json-extra
      plugin_directory: json_extra
      build_target: json_extra
      plugin_library: json_extra.so
      cmake_options: -DPLUGIN_DATE_EXTRA=DYNAMIC
      test_suite: json_extra
      run_tests: ${{ startsWith(github.ref, 'refs/tags/v') }}
